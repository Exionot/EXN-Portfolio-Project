{% extends "base.html" %}
{% block title %} Home {% endblock %}

{% block content %}
<section id="home">
    <h1 class="hero-title">
        Just make it <b>exist</b> first,<br>
        you can make it <b>beautiful</b> later.
    </h1>
    <h5 class="hero-subtitle">
        — A quote from Adam Grant.
    </h5>
    <div class="hero-button-container">
        <a href="#projects" class="hero-button" tabindex="-1">
            <button id="hero-project-button">
                <i class="fa fa-folder-open" aria-hidden="true"></i>
                <span class="hero-button-text">
                    My Projects
                </span>
                <span class="hero-button-line"></span>
            </button>
        </a>

        <a href="#footer" class="hero-button" tabindex="-1">
            <button id="hero-contact-button">
                <i class="fa fa-phone" aria-hidden="true"></i>
                <span class="hero-button-text">
                    Contact Me
                </span>
                <span class="hero-button-line"></span>
            </button>
        </a>
    </div>
</section>
<section id="projects">
    <div class="projects-title-container">
        <h2>MY WORKS</h4>
    </div>
    <div class="projects-banner-gallery-wrapper">
        <div class="projects-gallery-container">
            <p class="projects-gallery-title">Title goes here...</p>
            <hr>
            <div class="projects-gallery-image-container">
                <a href="" class="projects-gallery-image-item">
                    <img src="{{ url_for('static', filename='/images/Staying Minty Final.png') }}" class="projects-gallery-image focus">
                </a>
                <a href="" class="projects-gallery-image-item">
                    <img src="{{ url_for('static', filename='/images/Canine Adventures Final.png') }}" class="projects-gallery-image">
                </a>
                <a href="" class="projects-gallery-image-item">
                    <img src="{{ url_for('static', filename='/images/Golden Aura Final.png') }}" class="projects-gallery-image">
                </a>
                <a href="" class="projects-gallery-image-item">
                    <img src="{{ url_for('static', filename='/images/Vixens Secret Final.png') }}" class="projects-gallery-image">
                </a>
            </div>
        
            <div class="projects-gallery-button-container">
                <button class="projects-gallery-button disabled" id="previous">
                    <i class="fa fa-chevron-left" aria-hidden="true"></i>
                </button>
                <button class="projects-gallery-button" id="next">
                    <i class="fa fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
</section>
<section id="about"></section>
{% endblock %}
